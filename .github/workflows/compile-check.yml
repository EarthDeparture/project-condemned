name: Compile Check

# Lightweight validation that runs on every push — no Unity license required.
# Catches missing packages, empty scripts, and manifest errors instantly.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json (required packages present)
        run: |
          python3 -c "
          import json, sys

          with open('Packages/manifest.json') as f:
              deps = json.load(f).get('dependencies', {})

          required = {
              'com.unity.netcode.gameobjects':       'Networking',
              'com.unity.render-pipelines.universal':'URP',
              'com.unity.services.relay':            'Relay (P2P)',
              'com.unity.services.lobby':            'Lobby',
              'com.unity.services.authentication':   'UGS Auth',
              'com.unity.inputsystem':               'Input System',
              'com.unity.cinemachine':               'Cinemachine',
              'com.unity.ai.navigation':             'AI Navigation',
              'com.unity.probuilder':                'ProBuilder',
          }

          failed = False
          for pkg, label in required.items():
              if pkg in deps:
                  print(f'  OK  {label} ({deps[pkg]})')
              else:
                  print(f'  FAIL  {label} — {pkg} missing from manifest.json')
                  failed = True

          sys.exit(1 if failed else 0)
          "

      - name: Check all .cs scripts are non-empty
        run: |
          EMPTY=$(find Assets/Scripts -name "*.cs" -empty 2>/dev/null)
          if [ -n "$EMPTY" ]; then
            echo "FAIL: Empty script files found:"
            echo "$EMPTY"
            exit 1
          fi
          COUNT=$(find Assets/Scripts -name "*.cs" | wc -l)
          echo "OK: $COUNT script files found, none empty."

      - name: Check .meta files exist for all scripts
        run: |
          MISSING=""
          for cs in $(find Assets/Scripts -name "*.cs"); do
            if [ ! -f "${cs}.meta" ]; then
              MISSING="$MISSING\n  MISSING: ${cs}.meta"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo -e "FAIL: Missing .meta files:$MISSING"
            exit 1
          fi
          echo "OK: All script .meta files present."

      - name: Verify required scenes exist
        run: |
          scenes=("Bootstrap" "MainMenu" "Lobby" "Game" "EndScreen")
          FAIL=0
          for scene in "${scenes[@]}"; do
            if [ -f "Assets/Scenes/${scene}.unity" ]; then
              echo "  OK  ${scene}.unity"
            else
              echo "  FAIL  Assets/Scenes/${scene}.unity not found"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Validate ARCHITECTURE.md exists
        run: |
          [ -f "ARCHITECTURE.md" ] && echo "OK: ARCHITECTURE.md present." || (echo "FAIL: ARCHITECTURE.md missing." && exit 1)
