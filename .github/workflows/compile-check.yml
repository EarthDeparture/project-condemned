name: Compile Check

# ─────────────────────────────────────────────────────────────────────────────
# Lightweight structural validation — runs on every push.
# No Unity license required. Catches the most common mistakes before a human
# ever has to open the project:
#   1. Required packages present in manifest.json
#   2. No empty .cs script files
#   3. Every .cs script has a corresponding .meta file (Unity tracking)
#   4. All five required scenes exist
#   5. ARCHITECTURE.md is present
#
# .meta files must always be committed alongside new scripts.
# Generate them manually (see CONTRIBUTING.md) or let the Unity Editor create
# them on first open — but always commit before pushing.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 1: Required packages ─────────────────────────────────────────
      - name: Validate manifest.json
        run: |
          python3 - <<'EOF'
          import json, sys

          with open('Packages/manifest.json') as f:
              deps = json.load(f).get('dependencies', {})

          required = {
              'com.unity.netcode.gameobjects':        'Netcode for GameObjects (NGO)',
              'com.unity.render-pipelines.universal': 'Universal Render Pipeline (URP)',
              'com.unity.services.authentication':    'UGS Authentication',
              'com.unity.inputsystem':                'Input System',
              'com.unity.cinemachine':                'Cinemachine',
              'com.unity.ai.navigation':              'AI Navigation',
              'com.unity.probuilder':                 'ProBuilder',
          }

          failed = False
          for pkg, label in required.items():
              if pkg in deps:
                  print(f'  ✓  {label}  ({deps[pkg]})')
              else:
                  print(f'  ✗  {label}  — {pkg} missing from manifest.json')
                  failed = True

          if failed:
              sys.exit(1)
          else:
              print(f'\n  All {len(required)} required packages present.')
          EOF

      # ── Step 2: No empty scripts ──────────────────────────────────────────
      - name: Check scripts are non-empty
        run: |
          EMPTY=$(find Assets/Scripts -name "*.cs" -empty 2>/dev/null)
          if [ -n "$EMPTY" ]; then
            echo "✗ Empty script files found:"
            echo "$EMPTY"
            exit 1
          fi
          COUNT=$(find Assets/Scripts -name "*.cs" | wc -l | tr -d ' ')
          echo "✓ $COUNT script(s) — none empty."

      # ── Step 3: .meta file coverage ───────────────────────────────────────
      - name: Check .meta files for all scripts
        run: |
          MISSING=""
          for cs in $(find Assets/Scripts -name "*.cs" | sort); do
            if [ ! -f "${cs}.meta" ]; then
              MISSING="$MISSING\n  ✗  ${cs}.meta"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo -e "Missing .meta files (commit these alongside their scripts):$MISSING"
            echo ""
            echo "Unity cannot track assets without .meta files."
            echo "See CONTRIBUTING.md — 'Adding new scripts' section."
            exit 1
          fi

          COUNT=$(find Assets/Scripts -name "*.cs.meta" | wc -l | tr -d ' ')
          echo "✓ $COUNT .meta file(s) — all present."

      # ── Step 4: Required scenes ───────────────────────────────────────────
      - name: Check required scenes exist
        run: |
          FAIL=0
          for scene in Bootstrap MainMenu Lobby Game EndScreen; do
            if [ -f "Assets/Scenes/${scene}.unity" ]; then
              echo "  ✓  ${scene}.unity"
            else
              echo "  ✗  Assets/Scenes/${scene}.unity — not found"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "All scenes present." || exit 1

      # ── Step 5: Docs ──────────────────────────────────────────────────────
      - name: Check required documentation
        run: |
          FAIL=0
          for doc in ARCHITECTURE.md CONTRIBUTING.md; do
            if [ -f "$doc" ]; then
              echo "  ✓  $doc"
            else
              echo "  ✗  $doc — not found"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] || exit 1
