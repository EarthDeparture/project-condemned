name: Unity Build CI

# Full Unity build — requires UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secrets.
# See Docs/CI_SETUP.md for activation instructions.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:   6000.3.10f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName:      ProjectCondemned
          buildsPath:     Builds
          versioning:     Semantic

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ProjectCondemned-${{ matrix.targetPlatform }}-${{ github.sha }}
          path: Builds/${{ matrix.targetPlatform }}
          retention-days: 7
