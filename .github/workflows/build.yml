name: Unity Build CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest

    # Skip if Unity license secrets are not yet configured
    if: ${{ secrets.UNITY_LICENSE != '' }}

    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ── Cache Unity Library ───────────────────────────────────────────────────
      # The Library folder is regenerated by Unity from Assets + ProjectSettings.
      # Caching it saves 5–15 minutes on subsequent builds.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:   6000.3.10f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName:      ProjectCondemned
          buildsPath:     Builds
          versioning:     Semantic

      # ── Upload build artifact ─────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ProjectCondemned-${{ matrix.targetPlatform }}-${{ github.sha }}
          path: Builds/${{ matrix.targetPlatform }}
          retention-days: 7

  # ── Compile check (no license required) ──────────────────────────────────────
  # Validates that scripts compile cleanly without running a full build.
  # Runs on every push regardless of license status.
  compile-check:
    name: Script compile check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for C# syntax errors (basic)
        run: |
          echo "Checking for obvious script issues..."
          # Verify all .cs files are present and non-empty
          find Assets/Scripts -name "*.cs" | while read f; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Empty script file: $f"
              exit 1
            fi
          done
          echo "Script file check passed — $(find Assets/Scripts -name '*.cs' | wc -l) scripts found."

      - name: Validate manifest.json
        run: |
          python3 -c "
          import json, sys
          with open('Packages/manifest.json') as f:
              d = json.load(f)
          required = [
              'com.unity.netcode.gameobjects',
              'com.unity.render-pipelines.universal',
              'com.unity.services.relay',
              'com.unity.services.lobby',
              'com.unity.inputsystem',
              'com.unity.cinemachine',
              'com.unity.ai.navigation',
          ]
          deps = d.get('dependencies', {})
          missing = [p for p in required if p not in deps]
          if missing:
              print(f'FAIL: Missing required packages: {missing}')
              sys.exit(1)
          print(f'OK: All {len(required)} required packages present.')
          "
